# 访古持续集成：push 到 main 和所有 pull request 都运行。
# 图片、原稿和参考照片不在 Git 中（见 docs/development.md#本地资源包），
# 因此依赖本地图版的 Node 测试会在这里报告为跳过，iOS 以空图版目录构建；完整验证仍在本地执行。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_tests:
        description: 同时运行 FangguUITests（较慢）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  # line-plate、prototype-pipeline 等测试调用 ImageMagick 7 的 `magick`；Ubuntu 24.04 的 apt 只有 6.x，故用官方 AppImage。
  IMAGEMAGICK_VERSION: '7.1.2-32'

jobs:
  catalog:
    name: 目录数据、脚本与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Python 依赖
        run: python -m pip install --quiet --upgrade pip numpy pillow

      - name: 安装 ImageMagick 7
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ImageMagick.AppImage" \
            "https://github.com/ImageMagick/ImageMagick/releases/download/$IMAGEMAGICK_VERSION/ImageMagick-$IMAGEMAGICK_VERSION-gcc-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/ImageMagick.AppImage"
          (cd "$RUNNER_TEMP" && ./ImageMagick.AppImage --appimage-extract >/dev/null)
          printf '#!/bin/sh\nexec "%s/squashfs-root/AppRun" "$@"\n' "$RUNNER_TEMP" | sudo tee /usr/local/bin/magick >/dev/null
          sudo chmod +x /usr/local/bin/magick
          magick -version | head -n 1

      - name: 空白与行尾检查
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Node 测试
        # 需要本地图版素材的测试由 tests/helpers/local-assets.cjs 标记，在 CI 中跳过。
        run: node --test tests/*.test.cjs

      - name: 国保资料核对
        run: node scripts/prepare-protection.mjs --check

      - name: iOS 目录导出与 Git 一致
        run: |
          node ios/scripts/build-catalog.cjs
          if ! git diff --quiet -- ios/Fanggu/Resources/catalog.json ios/Fanggu/Resources/curations.json; then
            echo "::error file=ios/scripts/build-catalog.cjs::目录导出已过期：本地运行 node ios/scripts/build-catalog.cjs 后提交 catalog.json 与 curations.json"
            git --no-pager diff --stat -- ios/Fanggu/Resources/catalog.json ios/Fanggu/Resources/curations.json
            exit 1
          fi

      - name: Python 测试
        run: python -B -m unittest discover -s tests -p 'test_*.py'

  ios:
    name: iOS 构建与单元测试
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 工具版本
        run: |
          xcodebuild -version
          swift --version
          node --version

      - name: 安装 XcodeGen 与 xcbeautify
        run: brew install xcodegen xcbeautify

      - name: 生成 Xcode 工程
        working-directory: ios
        run: |
          xcodegen generate
          if ! git diff --quiet -- Fanggu.xcodeproj; then
            echo "::warning file=ios/project.yml::xcodegen generate 的结果与提交的 Fanggu.xcodeproj 不一致，本地重新生成后提交（也可能只是 XcodeGen 版本差异）"
            git --no-pager diff --stat -- Fanggu.xcodeproj
          fi

      - name: 原生地图几何与目录导出测试
        # ios-map-layout 需要 Swift 工具链，在 Linux job 中会跳过。
        run: node --test tests/ios-map-layout.test.cjs tests/ios-catalog.test.cjs

      - name: 准备空图版目录
        # Artwork 由 ios/scripts/sync-artwork.sh 从本地素材同步且被 Git 忽略；没有该目录时 Copy Bundle Resources 会失败。
        run: mkdir -p ios/Fanggu/Resources/Artwork

      - name: 运行 FangguTests
        # run-ios-tests.sh 通过 test-device.sh 创建独立模拟器（默认 iPhone 16 Pro、最新 iOS 运行时）并使用 ios/build/DerivedData。
        env:
          FANGGU_SIM_NAME: Fanggu CI
        run: |
          set -o pipefail
          mkdir -p ios/build
          sh ios/scripts/run-ios-tests.sh -only-testing:FangguTests \
            -resultBundlePath ios/build/FangguTests.xcresult CODE_SIGNING_ALLOWED=NO \
            | tee ios/build/unit-tests.log | xcbeautify --renderer github-actions

      - name: 运行 FangguUITests
        if: inputs.ui_tests
        env:
          FANGGU_SIM_NAME: Fanggu CI
        run: |
          set -o pipefail
          sh ios/scripts/run-ios-tests.sh -only-testing:FangguUITests \
            -resultBundlePath ios/build/FangguUITests.xcresult CODE_SIGNING_ALLOWED=NO \
            | tee ios/build/ui-tests.log | xcbeautify --renderer github-actions

      - name: 上传测试结果
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ios/build/*.xcresult
            ios/build/*.log
          if-no-files-found: ignore
          retention-days: 7
