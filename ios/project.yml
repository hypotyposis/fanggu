name: Fanggu
options:
  bundleIdPrefix: com.fanggu
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "18.0"
targets:
  Fanggu:
    type: application
    platform: iOS
    sources:
      - path: Fanggu
        excludes:
          - Resources/Artwork
      - path: Fanggu/Resources/Artwork
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fanggu.app
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 访古
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 把访古卡保存到你的相册。访古只添加图片，不读取相册内容。
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - FangguTests
        - FangguUITests
  FangguTests:
    type: bundle.unit-test
    platform: iOS
    sources: FangguTests
    dependencies:
      - target: Fanggu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fanggu.app.tests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
  FangguUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: FangguUITests
    dependencies:
      - target: Fanggu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fanggu.app.uitests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
