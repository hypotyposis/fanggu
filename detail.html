<dialog class="journal-dialog" id="visit-dialog" aria-labelledby="visit-title">

    <div class="dialog-head"><span class="mono">到访记</span><button class="dialog-close" type="button" data-close aria-label="关闭打卡记录">×</button></div>

    <p class="form-error" role="alert" hidden></p><div class="dialog-actions review-actions"><button type="button" class="journal-button" id="review-clear" hidden>清除评价</button><button type="button" class="journal-button" data-close>取消</button><button type="submit" class="journal-button primary">保存评价</button></div>

</dialog>
