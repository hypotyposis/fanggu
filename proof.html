<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>访古 · 线稿总览</title>
<link rel="stylesheet" href="style.css?v=20260917-reviews1">
<style>body{padding:24px}.proof-nav{display:flex;gap:24px;margin-bottom:32px;font-size:12px}.p{display:grid;grid-template-columns:1fr;gap:32px}.p figure{margin:0;max-width:1100px}.p .draft{filter:none}.p h4{margin:0 0 12px;font-weight:400;font-size:12px}.p.grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:36px 24px}.p.grid figure{padding:16px;border:1px solid rgba(214,171,92,.15)}.p.grid img.plate,.p.grid .draft{height:300px;object-fit:contain}.p a{display:block}.p .proof-caption{font-size:11px;color:var(--paper-3);margin:12px 0 0}</style>
</head><body><nav class="proof-nav mono"><a href="index.html">← 访古</a><a href="proof.html?view=grid">全套线稿</a><a href="sources.html">图版来源</a></nav><div class="p" id="p"></div>
<script src="draft.js"></script><script src="buildings.js"></script><script src="sites.js?v=20260918-shanghai-shanxi1"></script><script src="plates.js?v=20260918-shanghai-shanxi1"></script>
<script>
const want = new URLSearchParams(location.search).get('fig');
document.getElementById('p').classList.toggle('grid', new URLSearchParams(location.search).get('view') === 'grid');
const list = [{ id: 'hero', name: '佛光寺 · 柱头铺作', image: PLATES.hero, draw: () => Buildings.bracketSection() }, ...SITES];
for (const s of list) {
  if (want && s.id !== want) continue;
  const f = document.createElement('figure'); f.innerHTML = `<h4 class="mono">${s.id} · ${s.name}</h4>`;
  f.style.setProperty('--acc', DYN[s.dyn || 'tang'].acc);
  if (s.image) {
    const im = document.createElement('img'); im.className = 'plate' + (s.image.tint === false ? ' raw' : '');
    im.src = s.image.src; im.alt = s.image.alt || s.name; im.width = s.image.width; im.height = s.image.height; im.decoding = 'async'; im.loading = want ? 'eager' : 'lazy';
    const link = document.createElement('a'); link.href = 'proof.html?fig=' + s.id; link.appendChild(im);
    f.classList.add('site-fig'); f.appendChild(link);
    const caption = document.createElement('p'); caption.className = 'proof-caption mono'; caption.textContent = (s.image.caption || s.caption || ['柱头铺作 · 正面']).join(' / '); f.appendChild(caption);
    document.getElementById('p').appendChild(f); continue;
  }
  const svg = Buildings.render(s.draw(), { ghost: false }); f.appendChild(svg); document.getElementById('p').appendChild(f);
  svg.classList.add('drawn');
  svg.querySelectorAll('.notes .note').forEach(n => n.style.opacity = 1); svg.querySelector('.dims').style.opacity = 1;
}
</script></body></html>
